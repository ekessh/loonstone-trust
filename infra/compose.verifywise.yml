# VerifyWise for Loonstone Trust: the AI governance system of record (system
# register, model inventory, risk register, suppliers, ISO/IEC 42001 AIMS).
# It is not in the call path and cannot change a call decision.
#
# Adapted from the physio-governance lab stack. Secrets come from infra/.env
# (git-ignored). Every published port binds 127.0.0.1. Ports avoid the other
# local VerifyWise stacks (8080/3000, 8082/3101) and Loonstone Langfuse (3000).
#   UI      http://localhost:8084
#   API     http://localhost:3104
#   Mailpit http://localhost:8027  (invite emails land here)

name: loonstone-verifywise

services:
  verifywise-postgresdb:
    image: postgres:16.8@sha256:301bcb60b8a3ee4ab7e147932723e3abd1cef53516ce5210b39fd9fe5e3602ae
    restart: unless-stopped
    volumes:
      - verifywise_db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: verifywise
      POSTGRES_PASSWORD: ${VW_DB_PASSWORD:?set in infra/.env}
      POSTGRES_DB: verifywise
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "verifywise", "-d", "verifywise"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    restart: unless-stopped
    ports:
      - 127.0.0.1:8027:8025      # web UI: read the invite link here
    expose:
      - "1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  verifywise-redis:
    image: redis:7@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  verifywise-backend:
    image: ghcr.io/verifywise-ai/verifywise-backend:latest@sha256:905f75bd8ee66790ea2a4a16daf0fbeafa1909c6b6c9dc9de47cecf8481a7538
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      verifywise-postgresdb:
        condition: service_healthy
      verifywise-redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    ports:
      - 127.0.0.1:${VW_BACKEND_PORT:-3104}:3001
    environment:
      PORT: 3001
      DB_HOST: verifywise-postgresdb
      DB_USER: verifywise
      DB_PORT: 5432
      DB_PASSWORD: ${VW_DB_PASSWORD:?set in infra/.env}
      DB_NAME: verifywise
      MOCK_DATA_ON: "false"
      JWT_SECRET: ${VW_JWT_SECRET:?set in infra/.env}
      REFRESH_TOKEN_SECRET: ${VW_REFRESH_SECRET:?set in infra/.env}
      ENCRYPTION_KEY: ${VW_ENCRYPTION_KEY:?set in infra/.env}
      LLM_EVALS_URL: http://verifywise-eval-server:8000
      EVAL_SERVER_INTERNAL_KEY: ${VW_EVAL_INTERNAL_KEY:?set in infra/.env}
      REDIS_URL: redis://verifywise-redis:6379/0
      AI_GATEWAY_URL: http://verifywise-ai-gateway:8100
      AI_GATEWAY_INTERNAL_KEY: ${VW_GATEWAY_INTERNAL_KEY:?set in infra/.env}
      SUPERADMIN_EMAIL: ${VW_ADMIN_EMAIL:-aims@loonstone.local}
      # Local mail catcher. VerifyWise's invite flow sends an email containing the
      # registration token, so without a working mail path no user can ever be
      # created and the AIMS stays empty. Mailpit accepts everything and delivers
      # nothing outside the host, which is the right shape for a lab.
      EMAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      # VerifyWise requires all four SMTP variables to be non-empty before it will
      # send. Mailpit is configured to accept any credentials, so these are
      # placeholders that satisfy the check rather than secrets.
      SMTP_USER: mailpit
      SMTP_PASS: mailpit
      EMAIL_ID: ${VW_ADMIN_EMAIL:-aims@loonstone.local}
      SUPERADMIN_PASSWORD: ${VW_ADMIN_PASSWORD:?set in infra/.env}
      FRONTEND_URL: http://localhost:${VW_FRONTEND_PORT:-8084}
      BACKEND_URL: http://localhost:${VW_BACKEND_PORT:-3104}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const net=require('net'); const s=net.connect(3001,'127.0.0.1',()=>process.exit(0)); s.on('error',()=>process.exit(1)); setTimeout(()=>process.exit(1),3000);\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  verifywise-frontend:
    image: ghcr.io/verifywise-ai/verifywise-frontend:latest@sha256:72c095a4d43eaff246509eea78d81845d8e5c46e21d476d49ccb552fb766ca37
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      - verifywise-backend
    ports:
      - 127.0.0.1:${VW_FRONTEND_PORT:-8084}:80
    volumes:
      - ./verifywise/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      FRONTEND_URL: http://localhost:${VW_FRONTEND_PORT:-8084}
      BACKEND_URL: http://localhost:${VW_BACKEND_PORT:-3104}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  verifywise-worker:
    image: ghcr.io/verifywise-ai/verifywise-backend:latest@sha256:905f75bd8ee66790ea2a4a16daf0fbeafa1909c6b6c9dc9de47cecf8481a7538
    pull_policy: missing
    restart: unless-stopped
    command: ["node", "dist/jobs/worker.js"]
    depends_on:
      verifywise-postgresdb:
        condition: service_healthy
      verifywise-redis:
        condition: service_healthy
    environment:
      DB_HOST: verifywise-postgresdb
      DB_USER: verifywise
      DB_PORT: 5432
      DB_PASSWORD: ${VW_DB_PASSWORD:?set in infra/.env}
      DB_NAME: verifywise
      JWT_SECRET: ${VW_JWT_SECRET:?set in infra/.env}
      REDIS_URL: redis://verifywise-redis:6379/0
      ENCRYPTION_KEY: ${VW_ENCRYPTION_KEY:?set in infra/.env}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"process.exit(0)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  verifywise-eval-server:
    image: ghcr.io/verifywise-ai/verifywise-eval-server:latest@sha256:7213fac1f947f1af53ed6817a129240afee006fd4289d8d3953f5c0ff9a33860
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      - verifywise-backend
      - verifywise-redis
    expose:
      - "8000"
    volumes:
      - verifywise_eval_uploads:/app/data/uploads
    environment:
      DB_HOST: verifywise-postgresdb
      DB_USER: verifywise
      DB_PORT: 5432
      DB_PASSWORD: ${VW_DB_PASSWORD:?set in infra/.env}
      DB_NAME: verifywise
      BACKEND_URL: http://verifywise-backend:3001
      REDIS_URL: redis://verifywise-redis:6379/0
      ENCRYPTION_KEY: ${VW_ENCRYPTION_KEY:?set in infra/.env}
      EVAL_SERVER_INTERNAL_KEY: ${VW_EVAL_INTERNAL_KEY:?set in infra/.env}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1',8000),3); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  verifywise-ai-gateway:
    image: ghcr.io/verifywise-ai/verifywise-ai-gateway:latest@sha256:bd9193b7a681de95daeb5d574bfd29353a8fff8c19f0688fcce781e543febe3e
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      verifywise-postgresdb:
        condition: service_healthy
      verifywise-redis:
        condition: service_healthy
    expose:
      - "8100"
    extra_hosts:
      # Lets the gateway reach Ollama on the host.
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: verifywise-postgresdb
      DB_PORT: 5432
      DB_USER: verifywise
      DB_PASSWORD: ${VW_DB_PASSWORD:?set in infra/.env}
      DB_NAME: verifywise
      AI_GATEWAY_INTERNAL_KEY: ${VW_GATEWAY_INTERNAL_KEY:?set in infra/.env}
      AI_GATEWAY_PORT: 8100

volumes:
  verifywise_db:
  verifywise_eval_uploads:
